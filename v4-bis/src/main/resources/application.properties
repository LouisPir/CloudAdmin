# ============================================================
# SERVER
# ============================================================
server.port=8000

# JSON output: snake_case to match V1's Python output
spring.jackson.property-naming-strategy=SNAKE_CASE

# ============================================================
# DATABASE (MySQL)
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/database_netflix
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# HIKARICP CONNECTION POOL  (V4-bis: raised from 20 → 80)
# ============================================================
spring.datasource.hikari.maximum-pool-size=80
spring.datasource.hikari.minimum-idle=40
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# ============================================================
# TOMCAT THREAD POOL
# ============================================================
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20

# ============================================================
# LOCAL CACHE (ConcurrentHashMap — no Redis)
# ============================================================
# Our CacheService reads this value
app.cache.ttl-seconds=60
